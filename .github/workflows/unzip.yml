name: Auto Unzip Uploaded ZIP

on:
  push:
    paths:
      - "**.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Download repo files
        uses: actions/checkout@v4

      - name: Extract ZIP files
        run: |
          for zip in *.zip; do
            unzip -o "$zip"
            rm "$zip"
          done

      - name: Save extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Auto extracted ZIP" || echo "Nothing to commit"
          git push
